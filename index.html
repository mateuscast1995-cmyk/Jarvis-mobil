<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="description" content="JARVIS — seu assistente pessoal">
<link rel="manifest" href="manifest.webmanifest">
<title>JARVIS</title>
<style>
:root{color-scheme:dark;--bg:#050b14;--panel:#0b1828;--cyan:#4de3ff;--muted:#91a9bc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 28%,#102c43 0,#07111f 38%,#03070d 78%);color:#eaf8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{max-width:560px;margin:auto;padding:env(safe-area-inset-top) 20px 28px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 0 10px}
.brand{letter-spacing:.28em;font-weight:700;color:var(--cyan);font-size:14px}.status{font-size:11px;color:#8be9bd;border:1px solid #245b51;border-radius:30px;padding:6px 10px}
h1{text-align:center;font-size:29px;letter-spacing:.13em;margin:25px 0 4px;font-weight:500}
.sub{text-align:center;color:var(--muted);font-size:13px}
.orb-wrap{display:grid;place-items:center;flex:1;min-height:260px}
.orb{width:190px;height:190px;border-radius:50%;border:1px solid #3bdcf8;box-shadow:0 0 24px #16bde755,inset 0 0 28px #16bde733;display:grid;place-items:center;position:relative;background:radial-gradient(circle,#12334a 0,#071827 56%,#06101a 70%)}
.orb:before,.orb:after{content:"";position:absolute;border-radius:50%;border:1px solid #37dfff66;inset:-13px;animation:pulse 3s infinite}
.orb:after{inset:-27px;opacity:.5;animation-delay:1.5s}
.orb.listening{box-shadow:0 0 50px #36e6ff99,inset 0 0 45px #36e6ff55}
.orb span{font-size:46px;color:var(--cyan);text-shadow:0 0 18px #4de3ff}
@keyframes pulse{50%{transform:scale(1.08);opacity:.25}}
#reply{background:#0a1928cc;border:1px solid #18384d;border-radius:16px;padding:15px;min-height:76px;color:#d9f4ff;line-height:1.5;font-size:14px}
#heard{color:var(--muted);font-size:12px;min-height:20px;margin:12px 2px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
button{border:1px solid #27617a;background:#0d2638;color:#e9fbff;border-radius:14px;padding:14px 10px;font-size:14px;font-weight:600}
button.primary{background:linear-gradient(135deg,#0b7795,#12415e);border-color:#46dfff}
button:active{transform:scale(.98)}
.entry{display:flex;gap:8px;margin-top:5px}
input{min-width:0;flex:1;background:#071522;border:1px solid #23465b;border-radius:12px;color:white;padding:13px;font-size:14px}
small{display:block;color:#7992a7;text-align:center;font-size:11px;line-height:1.5;margin-top:18px}
</style>
</head>
<body>
<main>
<header><div class="brand">J.A.R.V.I.S.</div><div class="status" id="status">● ONLINE</div></header>
<h1>ASSISTENTE PESSOAL</h1><div class="sub">À sua disposição.</div>
<div class="orb-wrap"><div class="orb" id="orb"><span>J</span></div></div>
<div id="reply" aria-live="polite">Olá. Sou a JARVIS. Toque no microfone e fale comigo.</div>
<div id="heard"></div>
<div class="controls">
<button class="primary" id="mic">🎙 Falar comigo</button>
<button id="speak">🔊 Repetir resposta</button>
<button id="chat">✦ Abrir ChatGPT</button>
<button id="help">⌘ Ver comandos</button>
</div>
<form class="entry" id="form"><input id="message" placeholder="Digite um comando..." autocomplete="off"><button class="primary" type="submit">Enviar</button></form>
<small>Versão 1.0 • Recursos de voz dependem do navegador e da conexão.<br>Esta versão não controla funções sensíveis do aparelho.</small>
</main>
<script>
const reply=document.getElementById('reply'), heard=document.getElementById('heard'), orb=document.getElementById('orb'), statusEl=document.getElementById('status');
let lastReply='Olá. Sou a JARVIS. Toque no microfone e fale comigo.';
function say(text){lastReply=text;reply.textContent=text;if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=.92;u.pitch=1.03;const voices=speechSynthesis.getVoices();const pt=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('pt-br'))||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('pt'));if(pt)u.voice=pt;speechSynthesis.speak(u)}}
function respond(raw){const q=raw.toLowerCase().trim();heard.textContent='Você: '+raw;
if(!q)return;
if(q.includes('olá')||q.includes('oi')||q.includes('bom dia')||q.includes('boa tarde')||q.includes('boa noite')){say('Olá! É um prazer falar com você. Como posso ajudar?');}
else if(q.includes('horas')||q.includes('hora')){say('Agora são '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'.');}
else if(q.includes('data')||q.includes('dia é')){say('Hoje é '+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.');}
else if(q.includes('comandos')||q.includes('ajuda')){say('Você pode perguntar as horas, a data, dizer olá ou abrir o ChatGPT para conversar sobre outros assuntos.');}
else if(q.includes('abrir youtube')){say('Abrindo o YouTube.');window.open('https://m.youtube.com','_blank');}
else if(q.includes('abrir google')){say('Abrindo o Google.');window.open('https://www.google.com','_blank');}
else if(q.includes('abrir chatgpt')||q.includes('conversar com inteligência artificial')){say('Abrindo o ChatGPT.');window.open('https://chatgpt.com','_blank');}
else{say('Ainda não tenho esse comando na versão inicial. Posso abrir o ChatGPT para uma conversa mais avançada.');}
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition;
if(SR){recognition=new SR();recognition.lang='pt-BR';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onstart=()=>{orb.classList.add('listening');statusEl.textContent='● OUVINDO'};recognition.onend=()=>{orb.classList.remove('listening');statusEl.textContent='● ONLINE'};recognition.onerror=(e)=>{say('Não consegui ouvir com clareza. Verifique a permissão do microfone e tente novamente.');};recognition.onresult=e=>respond(e.results[0][0].transcript);}
else{document.getElementById('mic').disabled=true;statusEl.textContent='VOZ INDISPONÍVEL';}
document.getElementById('mic').onclick=()=>{if(recognition){try{recognition.start()}catch(e){}}};
document.getElementById('speak').onclick=()=>say(lastReply);
document.getElementById('chat').onclick=()=>window.open('https://chatgpt.com','_blank');
document.getElementById('help').onclick=()=>say('Comandos disponíveis: que horas são, qual a data de hoje, abrir YouTube, abrir Google e abrir ChatGPT.');
document.getElementById('form').onsubmit=e=>{e.preventDefault();const el=document.getElementById('message');respond(el.value);el.value='';};
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
</body></html>
